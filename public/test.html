<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SLA Pulse API — Teste de Sessão</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#111827; color:#f3f4f6; padding:24px; }
    .card { width:min(520px,100%); background:#1f2937; border:1px solid #374151; border-radius:16px; padding:28px; }
    h1 { margin:0 0 4px; }
    p { color:#9ca3af; }
    label { display:block; margin:14px 0 7px; font-weight:600; }
    input { width:100%; padding:12px; border:1px solid #4b5563; border-radius:10px; background:#111827; color:#fff; }
    .buttons { display:flex; gap:10px; margin-top:18px; }
    button { flex:1; padding:12px; border:0; border-radius:10px; font-weight:700; cursor:pointer; }
    #result { margin-top:18px; padding:14px; border:1px solid #374151; border-radius:10px; background:#111827; white-space:pre-wrap; word-break:break-word; min-height:90px; }
    .ok { border-color:#166534!important; }
    .error { border-color:#991b1b!important; }
    .hint { font-size:12px; line-height:1.5; margin-top:14px; color:#9ca3af; }
  </style>
</head>
<body>
  <main class="card">
    <h1>SLA Pulse API</h1>
    <p>Teste da autenticação com sessão — v1.3.0</p>

    <label for="username">Usuário</label>
    <input id="username" autocomplete="username">

    <label for="password">Senha</label>
    <input id="password" type="password" autocomplete="current-password">

    <div class="buttons">
      <button id="login">Entrar</button>
      <button id="validate">Validar sessão</button>
    </div>

    <div id="result">Aguardando teste...</div>

    <div class="hint">
      O token de teste fica somente no sessionStorage desta aba. Fechar a aba remove o token local.
    </div>
  </main>

  <script>
    const result = document.getElementById("result");
    const loginButton = document.getElementById("login");
    const validateButton = document.getElementById("validate");

    function show(value, type = "") {
      result.className = type;
      result.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
    }

    loginButton.addEventListener("click", async () => {
      show("Autenticando...");
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("/api/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.authorized && data.token) {
          sessionStorage.setItem("slaPulseTestToken", data.token);
          show({
            authorized: data.authorized,
            user: data.user,
            expiresAt: data.expiresAt,
            tokenStoredInSession: true
          }, "ok");
        } else {
          show(data, "error");
        }
      } catch (error) {
        show("Erro: " + error.message, "error");
      }
    });

    validateButton.addEventListener("click", async () => {
      const token = sessionStorage.getItem("slaPulseTestToken");

      if (!token) {
        show("Nenhum token de sessão disponível. Faça login primeiro.", "error");
        return;
      }

      show("Validando sessão...");

      try {
        const response = await fetch("/api/me", {
          headers: { Authorization: "Bearer " + token }
        });

        const data = await response.json();
        show(data, response.ok ? "ok" : "error");
      } catch (error) {
        show("Erro: " + error.message, "error");
      }
    });
  </script>
</body>
</html>
