<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jira SLA Monitor - Teste de Autenticação</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: #f3f4f6;
      padding: 24px;
    }

    .card {
      width: min(460px, 100%);
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #9ca3af;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #4b5563;
      background: #111827;
      color: #f9fafb;
      outline: none;
    }

    input:focus {
      border-color: #9ca3af;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px 14px;
      border: 0;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      background: #f3f4f6;
      color: #111827;
    }

    button:disabled {
      opacity: .65;
      cursor: wait;
    }

    .result {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      background: #111827;
      border: 1px solid #374151;
      min-height: 52px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ok { border-color: #166534; }
    .error { border-color: #991b1b; }

    .hint {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.45;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Jira SLA Monitor</h1>
    <p class="subtitle">Teste de autenticação da API</p>

    <form id="loginForm">
      <label for="username">Usuário</label>
      <input id="username" name="username" autocomplete="username" required />

      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <button id="submitButton" type="submit">TESTAR LOGIN</button>
    </form>

    <div id="result" class="result">Aguardando teste...</div>

    <div class="hint">
      Esta página existe apenas para validar a API antes da integração com a extensão.
      Não exibe nem armazena a senha digitada.
    </div>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const result = document.getElementById("result");
    const button = document.getElementById("submitButton");

    function show(message, type) {
      result.className = "result" + (type ? " " + type : "");
      result.textContent = message;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      button.disabled = true;
      show("Testando...", "");

      try {
        const response = await fetch("/api/auth", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json().catch(() => ({}));

        if (response.ok && data.authorized) {
          const user = data.user || {};
          show(
            "AUTORIZADO\n" +
            "Usuário: " + (user.username || username) + "\n" +
            "Nome: " + (user.name || "-") + "\n" +
            "Perfil: " + (user.role || "-"),
            "ok"
          );
        } else {
          show(
            "ACESSO NEGADO\n" +
            "Motivo: " + (data.reason || data.error || "unknown_error"),
            "error"
          );
        }
      } catch (error) {
        show("ERRO DE CONEXÃO\n" + error.message, "error");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
